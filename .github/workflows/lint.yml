name: lint

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --test scripts/tests/*.test.mjs
      - run: node scripts/lint.mjs --akm
      - run: node scripts/lint.mjs --akm examples/minimal-akm
      - run: node scripts/lint.mjs --okf-export examples/okf-export
      - run: node scripts/lint.mjs --links examples/okf-export
      - run: node scripts/lint.mjs --secrets
  skill-suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s skill-suite/tests -v
